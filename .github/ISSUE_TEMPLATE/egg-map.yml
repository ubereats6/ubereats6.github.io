name: 提供新搶蛋地圖
description: 上傳尚未收錄的搶蛋地圖，提供線索協助辨識功能開發
title: "[新地圖] "
body:
  - type: markdown
    attributes:
      value: |
        感謝分享新地圖！這是公開的 GitHub Issue，圖片與文字會公開顯示。請先移除不想公開的角色名稱等資訊。
  - type: input
    id: identifier
    attributes:
      label: 地圖線索或暫定名稱
      description: 不確定分類或樓層也沒關係，描述你能辨認的線索。
      placeholder: 例如：起點往右，出口在下方
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 地圖說明
      description: 請描述起點、出口、蛋、Boss 或挑戰等已知位置；若有來源或作者也請註明。
      placeholder: 例如：金色傳門在左上，藍色傳門在右下；圖片來源／作者為…
    validations:
      required: true
  - type: upload
    id: images
    attributes:
      label: 上傳新地圖圖片
      description: 請上傳 PNG 或 JPG 地圖圖片；圖片會公開顯示。
    validations:
      required: true
