name: 提供新搶蛋地圖
description: 上傳同時標出蛋、起點金色門與出口藍色門的新地圖
title: "[新地圖] "
body:
  - type: markdown
    attributes:
      value: |
        投稿圖片至少需要清楚標示蛋、起點金色門與出口藍色門，才會納入資料。這是公開的 GitHub Issue，圖片與文字會公開顯示；請先移除不想公開的資訊。
  - type: upload
    id: images
    attributes:
      label: 上傳新地圖圖片
      description: 請上傳 PNG 或 JPG。圖片必須有蛋、起點金色門與出口藍色門的標記。
    validations:
      required: true
  - type: checkboxes
    id: required-markers
    attributes:
      label: 確認必要標記
      options:
        - label: 圖片有清楚標出蛋
          required: true
        - label: 圖片有清楚標出起點金色門
          required: true
        - label: 圖片有清楚標出出口藍色門
          required: true
  - type: textarea
    id: notes
    attributes:
      label: 補充說明或圖片來源
      description: 若有作者或原始出處，請一併註明。
    validations:
      required: false
