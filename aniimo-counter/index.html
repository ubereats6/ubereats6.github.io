<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伊莫四人對策｜屬性推薦</title><meta name="description" content="逐隻輸入四位對手，依伊莫調查站屬性表推薦攻擊與防守屬性。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23112229'/%3E%3Cpath d='M12 42L30 16l11 15 11-9v25H12z' fill='%2366dbc0'/%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#eaf3f2;background:#101c21}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:28px 22px 70px}header{display:flex;justify-content:flex-end;flex-wrap:wrap;align-items:baseline;gap:15px;border-bottom:1px solid #355158;padding-bottom:18px}h1{margin-right:auto;font-size:clamp(1.5rem,4vw,2.25rem);margin:0;letter-spacing:.02em}header a,.source a{color:#7de4cf}header a{text-decoration:none}p{line-height:1.6}h2{font-size:1.2rem;margin:0 0 15px}.intro{color:#a6c1c1;margin:16px 0 22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.slot{background:#1b2c32;border:1px solid #39545b;border-radius:14px;padding:15px;min-width:0}.slot:focus-within{border-color:#72d5c3}.slot label{display:block;font-weight:700;margin-bottom:10px}.mode{display:flex;gap:5px;margin-bottom:11px}.mode button{flex:1;background:#253c43;border:1px solid #45636a;border-radius:8px;color:#c9dcdb;padding:7px}.mode button.active{background:#3c756c;color:white;border-color:#6bcfba}.search{position:relative}.search input,.manual select{width:100%;background:#102126;color:#f0faf7;border:1px solid #567078;border-radius:8px;padding:10px;min-height:44px}.results{position:absolute;z-index:20;top:calc(100% + 4px);width:100%;max-height:270px;overflow:auto;background:#254047;border:1px solid #69968e;border-radius:9px;box-shadow:0 16px 30px #0008}.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #42616a;background:none;color:white;padding:10px}.results button:hover,.results button:focus{background:#39766b}.results small{display:block;color:#c4d8d4}.chosen{color:#8ce6d1;min-height:28px;margin:10px 0 0;font-size:.88rem}.manual{display:grid;gap:8px}.manual small,.hint{color:#b6cdcc}.output{margin-top:25px}.summary{background:#183b3d;border:1px solid #4b807b;border-radius:12px;padding:14px 18px;margin:0 0 18px}.summary strong{color:#8ce6d1}.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#18292f;border:1px solid #38545c;border-radius:14px;padding:18px;min-width:0}.panel>p{color:#adc4c4;margin:0 0 15px}.rank{border-top:1px solid #355159;padding:12px 0}.rank-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.rank strong{font-size:1.1rem}.rank small{color:#afd1c9}.rank p{margin:7px 0 0;color:#c0d2d0;font-size:.9rem}.pill{display:inline-block;border-radius:7px;background:#2a514e;color:#b5f2df;padding:2px 8px;margin-right:4px}.detail{width:100%;border-collapse:collapse;margin-top:20px;min-width:570px}.detail th,.detail td{border-bottom:1px solid #3b555c;text-align:center;padding:10px 7px}.detail th:first-child,.detail td:first-child{text-align:left}.detail th{font-weight:600;color:#aac6c5}.table-wrap{overflow:auto}.good{color:#83e7bb}.bad{color:#efa89a}.neutral{color:#c9d6d3}.source{margin-top:24px;color:#aac5c1;font-size:.88rem}.empty{color:#b9d0cc}.loading{color:#b6d0cd}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.grid,.section-grid{grid-template-columns:1fr}.wrap{padding:20px 14px 50px}header{align-items:flex-start;flex-direction:column}.slot{padding:14px}}
</style></head><body><main class="wrap"><header><h1>伊莫四人對策</h1><a href="../tools.html">← 返回 TOOLS</a><a href="https://aniimo.lin3.net/tools/type-chart" target="_blank" rel="noopener">查看原始相剋表 ↗</a></header><p class="intro">逐隻輸入對手伊莫，或直接指定屬性。先看適合進攻的屬性，再看較能承受對手攻擊的屬性。</p><section aria-label="對手四隻伊莫"><div class="grid" id="slots"></div></section><section class="output" id="output" aria-live="polite"><p class="loading">正在讀取圖鑑…</p></section><p class="source">資料來源：<a href="https://aniimo.lin3.net/dex" target="_blank" rel="noopener">伊莫調查站圖鑑</a>與<a href="https://aniimo.lin3.net/tools/type-chart" target="_blank" rel="noopener">屬性相剋表</a>（擷取日期 2026-09-23）。推薦僅依屬性相剋；不含技能、強度、速度與實際隊伍配置。雙屬性分開列出倍率，不相乘。</p></main><script>
const TYPES=[['fire','火'],['water','水'],['grass','草'],['electric','電'],['ice','冰'],['rock','土'],['wind','風'],['holy','光'],['dark','暗']];
const ROWS=[[.625,.625,1.6,1,1.6,.625,1,.625,1],[1.6,.625,.625,1,.625,1.6,1,.625,1],[.625,1.6,.625,1,1,1.6,1,.625,1],[1,1.6,1,.625,.625,.625,1.6,1,1],[.625,1.6,1,1.6,.625,.625,.625,1,1],[1,.625,.625,1.6,1.6,.625,1,1,.625],[1,1,1.6,.625,1,1,.625,1,1.6],[1,1,1,.625,1,1,1.6,.625,1.6],[1.6,.625,1.6,1,1,1,.625,1.6,.625]];
const keys=TYPES.map(t=>t[0]), names=Object.fromEntries(TYPES), rate=(a,d)=>ROWS[keys.indexOf(a)][keys.indexOf(d)];let dex=[];const slots=Array.from({length:4},()=>({mode:'dex',query:'',item:null,types:[]}));const root=document.getElementById('slots'),out=document.getElementById('output');
function clean(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(item){return item.name+(item.form&&item.form!=='Basic Form'?' · '+item.form:'')+'（'+item.types.map(t=>names[t]).join('／')+'）'}
function drawSlots(){root.innerHTML=slots.map((s,i)=>`<article class="slot"><label for="q${i}">對手 ${i+1}</label><div class="mode"><button type="button" data-mode="dex" data-i="${i}" class="${s.mode==='dex'?'active':''}" aria-pressed="${s.mode==='dex'}">從圖鑑選</button><button type="button" data-mode="manual" data-i="${i}" class="${s.mode==='manual'?'active':''}" aria-pressed="${s.mode==='manual'}">手動屬性</button></div>${s.mode==='dex'?`<div class="search"><input id="q${i}" data-query="${i}" type="search" autocomplete="off" placeholder="搜尋伊莫名稱" value="${clean(s.query)}" aria-label="搜尋對手 ${i+1} 的伊莫" aria-expanded="false"><div class="results" id="res${i}" hidden></div></div><p class="chosen">${s.item?clean(label(s.item)):'尚未選擇'}</p>`:`<div class="manual"><select aria-label="對手 ${i+1} 第一屬性" data-type="${i}" data-pos="0"><option value="">選第一屬性</option>${TYPES.map(([k,n])=>`<option value="${k}" ${s.types[0]===k?'selected':''}>${n}</option>`).join('')}</select><select aria-label="對手 ${i+1} 第二屬性" data-type="${i}" data-pos="1"><option value="">無第二屬性</option>${TYPES.map(([k,n])=>`<option value="${k}" ${s.types[1]===k?'selected':''}>${n}</option>`).join('')}</select><small>第二屬性可留空</small></div>`}</article>`).join('')}
function showResults(i){const s=slots[i],box=document.getElementById('res'+i),input=document.getElementById('q'+i);if(!box)return;const q=s.query.trim().toLowerCase();if(!q){box.hidden=true;input.setAttribute('aria-expanded','false');return}const found=dex.filter(x=>(x.name+' '+x.form).toLowerCase().includes(q)).slice(0,12);box.innerHTML=found.length?found.map(x=>`<button type="button" data-pick="${dex.indexOf(x)}" data-i="${i}">${clean(x.name)}<small>${clean(x.form==='Basic Form'?'基礎型態':x.form)} · ${x.types.map(t=>names[t]).join('／')}</small></button>`).join(''):'<button type="button" disabled>找不到，請改用手動屬性</button>';box.hidden=false;input.setAttribute('aria-expanded','true')}
function badge(n){return `<span class="${n>1?'good':n<1?'bad':'neutral'}">${n}×</span>`}
function render(){const picked=slots.map((s,i)=>({...s,i,types:s.mode==='dex'?(s.item?.types||[]):s.types.filter(Boolean)})).filter(s=>s.types.length);if(!picked.length){out.innerHTML='<div class="summary empty">先選一隻對手，結果會即時更新；其餘欄位可以留空。</div>';return}const data=keys.map(k=>{let good=0,bad=0,neutral=0,defGood=0,defBad=0;let lines=picked.map(s=>{let attack=s.types.map(d=>rate(k,d));let incoming=s.types.map(a=>rate(a,k));good+=attack.filter(x=>x>1).length;bad+=attack.filter(x=>x<1).length;neutral+=attack.filter(x=>x===1).length;defGood+=incoming.filter(x=>x<1).length;defBad+=incoming.filter(x=>x>1).length;return {i:s.i,attack,incoming}});return {k,good,bad,neutral,defGood,defBad,lines}});
const attack=[...data].sort((a,b)=>(b.good-a.good)||(a.bad-b.bad)||(a.defBad-b.defBad)||(b.defGood-a.defGood));const defense=[...data].sort((a,b)=>(a.defBad-b.defBad)||(b.defGood-a.defGood)||(b.good-a.good)||(a.bad-b.bad));const all=picked.reduce((n,s)=>n+s.types.length,0);
const cards=(arr,kind)=>arr.slice(0,5).map((r,j)=>`<div class="rank"><div class="rank-head"><strong>${j+1}. <span class="pill">${names[r.k]}</span></strong><small>${kind==='atk'?`${r.good} 格剋制 · ${r.bad} 格受抵抗`:`${r.defGood} 格抵抗 · ${r.defBad} 格弱點`}</small></div><p>${r.lines.map(z=>`對手 ${z.i+1}：${(kind==='atk'?z.attack:z.incoming).map(badge).join('／')}`).join('　')}</p></div>`).join('');
out.innerHTML=`<div class="summary">已選 <strong>${picked.length} 隻對手</strong>、共 <strong>${all} 個屬性欄位</strong>。每格是對一個屬性的倍率；雙屬性會分開顯示。</div><div class="section-grid"><section class="panel"><h2>推薦攻擊屬性</h2><p>優先涵蓋更多 1.6×，並避開 0.625×。</p>${cards(attack,'atk')}</section><section class="panel"><h2>推薦應對屬性</h2><p>假設對手可能使用自己的任一屬性攻擊；優先減少被 1.6× 剋制的風險。</p>${cards(defense,'def')}</section></div><section class="panel" style="margin-top:18px"><h2>逐隻對照</h2><div class="table-wrap"><table class="detail"><thead><tr><th>我的屬性</th>${picked.map(s=>`<th>${s.item&&s.mode==='dex'?clean(s.item.name):'對手 '+(s.i+1)}<br><small>${s.types.map(t=>names[t]).join('／')}</small></th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr><td>${names[r.k]}</td>${r.lines.map(z=>`<td><small>攻</small> ${z.attack.map(badge).join('／')}<br><small>承</small> ${z.incoming.map(badge).join('／')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
root.addEventListener('click',e=>{const mode=e.target.closest('[data-mode]');if(mode){const i=+mode.dataset.i;slots[i].mode=mode.dataset.mode;drawSlots();render();return}const pick=e.target.closest('[data-pick]');if(pick){const i=+pick.dataset.i;slots[i].item=dex[+pick.dataset.pick];slots[i].query=slots[i].item.name;drawSlots();render()}});root.addEventListener('input',e=>{if(e.target.dataset.query!==undefined){const i=+e.target.dataset.query;slots[i].query=e.target.value;slots[i].item=null;showResults(i);render()}});root.addEventListener('change',e=>{if(e.target.dataset.type!==undefined){let s=slots[+e.target.dataset.type],pos=+e.target.dataset.pos;s.types[pos]=e.target.value;if(s.types[0]&&s.types[0]===s.types[1]){s.types[1]='';drawSlots()}render()}});document.addEventListener('click',e=>{if(!e.target.closest('.search'))document.querySelectorAll('.results').forEach(x=>x.hidden=true)});fetch('./dex.json').then(r=>{if(!r.ok)throw Error('圖鑑載入失敗');return r.json()}).then(d=>{dex=d;drawSlots();render()}).catch(()=>{drawSlots();render();out.insertAdjacentHTML('afterbegin','<p class="bad">圖鑑暫時無法載入。仍可切換「手動屬性」使用相剋推薦。</p>')});
</script></body></html>
