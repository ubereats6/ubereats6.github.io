<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://ubereats6.github.io; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
<title>伊莫搶蛋地圖 HUD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#e9f7ff;font-family:Inter,'Noto Sans TC','Microsoft JhengHei',sans-serif}
.hud{height:100%;display:flex;flex-direction:column;position:relative;border:1px solid rgba(95,197,255,.65);border-radius:13px;overflow:hidden;background:rgba(4,19,42,.92);box-shadow:0 14px 38px rgba(0,0,0,.4)}
.bar{display:flex;align-items:center;gap:10px;min-height:48px;padding:7px 10px;border-bottom:1px solid rgba(100,178,240,.35);background:linear-gradient(100deg,#143a66,#0a2142);-webkit-app-region:drag}
.logo{width:29px;height:29px;object-fit:contain;flex:none}
.title{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.controls{display:flex;gap:6px;-webkit-app-region:no-drag}
@media(max-width:300px){.logo{display:none}}
button{cursor:pointer;color:#e8f8ff;font:inherit;font-size:11px;border:1px solid rgba(119,192,253,.56);border-radius:8px;background:#173a62;padding:6px 7px;white-space:nowrap}
button:hover{background:#25639a}button:focus-visible,input:focus-visible{outline:2px solid #72dcff;outline-offset:2px}
.map-area{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#030914}
.map-area.can-pan{cursor:grab}.map-area.panning{cursor:grabbing}
.map-area img{width:100%;height:100%;object-fit:contain;display:none;pointer-events:none;user-select:none;transform-origin:center center}
.map-area img.ready{display:block}
.map-zoom{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;z-index:1;padding:4px;border:1px solid rgba(119,192,253,.55);border-radius:9px;background:rgba(7,28,55,.9);font-size:11px}
.map-zoom[hidden]{display:none}.map-zoom button{min-width:25px;padding:4px 6px}.map-zoom output{min-width:39px;text-align:center;font-variant-numeric:tabular-nums}
.empty{max-width:300px;padding:18px;text-align:center;line-height:1.55;color:#bfdaf1;font-size:14px}
.empty strong{display:block;margin-bottom:7px;color:#72dbff}
.candidate-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:6px 8px;background:#0a2442;border-top:1px solid rgba(100,178,240,.35)}
.candidate-strip[hidden]{display:none}.candidate-strip button{overflow:hidden;text-overflow:ellipsis;padding:7px 3px;font-size:10px}
.candidate-strip button.selected{background:#2479b6;border-color:#93e6ff;color:white}
.bottom{display:flex;align-items:center;gap:10px;min-height:47px;padding:7px 12px;border-top:1px solid rgba(100,178,240,.35);background:#0b294b;font-size:12px}
.bottom label{white-space:nowrap}.bottom input{min-width:55px;flex:1;accent-color:#49bfff}.bottom output{width:39px;text-align:right;font-variant-numeric:tabular-nums}
.resize-grip{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;-webkit-app-region:no-drag;background:linear-gradient(135deg,transparent 45%,rgba(105,212,255,.7) 46% 52%,transparent 53% 63%,rgba(105,212,255,.9) 64% 70%,transparent 71%)}
.lock-tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);padding:6px 11px;border:1px solid rgba(122,214,255,.62);border-radius:8px;background:rgba(5,24,51,.88);font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s}
.lock-tip.show{opacity:1}
body.locked .bar,body.locked .candidate-strip,body.locked .bottom,body.locked .map-zoom,body.locked .resize-grip{display:none}
body.locked .hud{border-color:rgba(95,197,255,.45);background:transparent;box-shadow:none}
body.locked .map-area{background:transparent}
body.locked .empty{display:none}
</style>
</head>
<body>
<div class="hud">
  <div class="bar"><img class="logo" src="icon.png" alt=""><strong class="title" id="title">搶蛋地圖輔助</strong><div class="controls"><button id="match" type="button">擷取辨識</button><button id="lock" type="button">鎖定 F8</button><button id="hide" type="button" aria-label="隱藏 HUD，快捷鍵 F9">隱藏 F9</button></div></div>
  <div class="map-area" id="mapArea"><img id="map" alt=""><div class="empty" id="empty"><strong>等待選擇地圖</strong>按「擷取辨識」，選取遊戲視窗中的地圖並框選；也可從網頁送入地圖。</div><div class="map-zoom" id="mapZoom" aria-label="地圖縮放" hidden><button id="zoomOut" type="button" aria-label="縮小地圖">－</button><output id="zoomLevel">100%</output><button id="zoomIn" type="button" aria-label="放大地圖">＋</button><button id="zoomReset" type="button" aria-label="還原地圖縮放">重設</button></div></div>
  <div class="candidate-strip" id="candidates" aria-label="切換候選地圖" hidden></div>
  <div class="bottom"><label for="opacity">透明度</label><input id="opacity" type="range" min="30" max="100" value="72"><output id="opacityValue">72%</output><span>拖曳標題移動；拉右下角縮放</span></div>
  <div class="resize-grip" id="resizeGrip" role="separator" aria-label="拖曳縮放視窗"></div>
  <div class="lock-tip" id="lockTip">F8 調整位置、大小與透明度</div>
</div>
<script src="renderer.js"></script>
</body>
</html>
