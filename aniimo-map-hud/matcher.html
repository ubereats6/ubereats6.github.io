<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'"><title>伊莫搶蛋地圖辨識</title><style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#e7f5ff;font-family:'Microsoft JhengHei',sans-serif}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:13px;border-bottom:1px solid #285077;padding-bottom:16px}header img{width:43px;height:43px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 12px}p{color:#b4cee4;line-height:1.55}section{margin-top:22px;background:#102745;border:1px solid #315b83;border-radius:14px;padding:18px}button,.file{display:inline-block;border:1px solid #5ebbf3;background:#174a7b;color:#fff;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}button:hover,.file:hover{background:#286ea8}button:disabled{opacity:.5;cursor:default}.file input{display:none}.actions{display:flex;flex-wrap:wrap;gap:10px}.sources,.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-top:14px}.source,.candidate{width:100%;text-align:left;background:#0b1e36;border:1px solid #376493}.source img{width:100%;height:112px;object-fit:contain;background:#030b17}.source span,.candidate small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.candidate strong{font-size:21px;display:block;color:#82daff}.candidate small{color:#afd0e8}.canvas-wrap{overflow:auto;max-height:65vh;background:#030b17;text-align:center;border-radius:9px;touch-action:none}.canvas-wrap canvas{max-width:100%;height:auto;cursor:crosshair;touch-action:none}.status{color:#8ddcff}#selection[hidden],#resultsPanel[hidden]{display:none}
</style></head><body><main><header><img src="icon.png" alt=""><div><h1>伊莫搶蛋地圖辨識 <small>Beta</small></h1><p>單張擷取 → 框選地圖 → 輪廓比對 → 點選候選地圖。</p></div></header><section><h2>取得地圖畫面</h2><div class="actions"><button id="capture" type="button">擷取視窗／螢幕</button><label class="file">開啟截圖檔<input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label></div><p>擷取只取目前的一張畫面，不會持續監看；來源清單中的縮圖只在本機處理。請先在遊戲中開啟地圖。</p><div class="sources" id="sources"></div></section><section id="selection" hidden><h2>框選地圖路徑範圍</h2><p>在畫面上拖曳框選；放開後自動比對。選到整張地圖時也可以按「整張比對」。</p><div class="canvas-wrap"><canvas id="preview"></canvas></div><div class="actions"><button id="full" type="button">整張比對</button><button id="retry" type="button">重新框選</button></div></section><p class="status" id="status" role="status">選擇擷取來源或開啟截圖。</p><section id="resultsPanel" hidden><h2>可能的地圖</h2><p>依路徑輪廓排序；分數不代表已確認。點選一張便會開啟可調大小與透明度的 HUD。</p><div class="results" id="results"></div></section></main><script src="matcher-ui.js"></script></body></html>
