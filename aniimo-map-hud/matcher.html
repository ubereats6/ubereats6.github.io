<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'"><title>伊莫搶蛋地圖辨識</title><style>

urce{padding:8px;text-align:left;background:#102745}.source img{width:100%;height:125px;object-fit:contain;background:#030b17;display:block}.source span{display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crop-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toolbar button{padding:6px 9px}.toolbar .active{background:#2587b4;border-color:#b3f0ff}.canvas-wrap{flex:1;min-height:150px;overflow:auto;background:#020914;border:1px solid #315b83;border-radius:9px;overscroll-behavior:contain;touch-action:none}.canvas-wrap canvas{display:block;max-width:none;height:auto;touch-action:none;cursor:crosshair}.canvas-wrap.pan canvas{cursor:grab}.status{padding:10px 18px;border-top:1px solid #315b83;color:#8ddcff;font-size:12px;flex:none}.live{color:#73edb6;font-size:12px}.live.paused{color:#e6ca83}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.candidate{border:1px solid #376493;background:#0b1e36;border-radius:10px;padding:9px}.candidate.top{border-color:#80dbff}.candidate .preview-button{padding:0;border:0;background:#030b17;display:block;width:100%;overflow:hidden;border-radius:6px}.candidate img{display:block;width:100%;height:170px;object-fit:contain}.candidate strong{display:block;font-size:18px;color:#82daff;margin:6px 0}.candidate small{color:#afd0e8;font-size:11px}.candidate .actions{margin-top:9px}.candidate p{font-size:11px}dialog{position:fixed;inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;width:min(860px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#071a33;border:1px solid #80dbff;border-radius:14px;padding:18px;color:#e7f5ff;box-shadow:0 24px 70px #000a}dialog::backdrop{background:#010712e0;backdrop-filter:blur(6px)}.dialog-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.dialog-head p{margin-top:6px}.dialog-footer{position:sticky;bo </style></head><body><header><img src="icon.webp" alt=""><div><h1>伊莫搶蛋地圖辨識 <small>Beta</small></h1><p id="stepLabel">01 選難度 → 02 選視窗 → 03 放大框選 → 04 選地圖</p></div></header><main>
<section id="modeStep" class="step"><h2>01 · 這次搶蛋是哪個難度？</h2><p>先確認難度，再前往下一步選擇遊戲視窗。</p><div class="modes"><label><input type="radio" name="difficulty" value="easy"><span>簡單<small>8 張地圖</small></span></label><label><input type="radio" name="difficulty" value="hard"><span>困難<small>6 張地圖</small></span></label><label><input type="radio" name="difficulty" value="nightmare"><span>噩夢<small>7 張地圖</small></span></label><label><input type="radio" name="difficulty" value="chaos"><span>渾沌<small>9 張地圖</small></span></label></div><div class="advice"><img src="marker-icons/main-2abed6d7020e.webp" alt="起點金色門">框選時建議包含起點金色門與周圍已探索道路，避免只有一小段走道。</div><div class="actions"><button id="nextSource" class="primary" type="button" disabled>下一步：選擇視窗 →</button><label class="file">開啟截圖檔<input id="upload" type="file" disabled accept="image/png,image/jpeg,image/webp"></label></div></section>
<section id="sourceStep" class="step" hidden><div class="crop-head"><h2>02 · 選擇遊戲視窗</h2><button id="backMode" type="button">← 難度</button></div><p>建議選遊戲視窗；進入框選頁後會即時更新。清單只擷取目前縮圖。</p><div class="actions"><button id="refreshSources" type="button">重新整理視窗清單</button></div><div id="sources" class="sources"></div></section>
<section id="cropStep" class="step" hidden><div class="crop-head"><h2>03 · 放大後框選地圖</h2><button id="backSources" type="button">← 換視窗</button></div><p id="sourceName"></p><div class="toolbar"><button id="zoomOut" type="button">－</button><output id="zoomLevel">100%</output><button id="zoomIn" type="button">＋</button><button id="fit" type="button">適合視窗</button><button id="selectMode" class="active" type="button">框選</button><button id="panMode" type="button">拖曳移動</button><button id="resumeLive" type="button">更新／恢復即時預覽</button><span id="liveState" class="live"></span></div><div id="cropViewport" class="canvas-wrap"><canvas id="preview" aria-label="滾輪放大，拖曳框選；可切換拖曳移動模式"></canvas></div><p>滾輪可放大縮小。切換「拖曳移動」或按住空白鍵／滑鼠右鍵移動；開始框選時會凍結目前畫面。</p><div class="actions"><button id="matchCrop" class="primary" type="button">比對框選範圍</button><button id="full" type="button">整張比對</button><button id="retry" type="button">重新框選</button><button id="reopenResults" type="button" hidden>查看四張候選</button></div></section>
</main><p id="status" class="status" role="status">請先選擇難度。</p><video id="captureVideo" autoplay muted playsinline></video>
<dialog id="candidateDialog" aria-labelledby="candidateTitle"><div class="dialog-head"><div><h2 id="candidateTitle">04 · 選擇最像的一張地圖</h2><p>可點縮圖放大預覽；分數只表示輪廓相似度，並非已確認。</p></div><button id="closeCandidates" type="button">關閉 ✕</button></div><div id="candidateChoices" class="results"></div><div class="dialog-footer actions"><button id="reframeCandidates" class="primary" type="button">重新框選</button><button id="updateCandidates" type="button">更新所選視窗畫面</button></div></dialog>
<dialog id="previewDialog" aria-labelledby="previewTitle"><div class="dialog-head"><h2 id="previewTitle">地圖預覽</h2><button id="closePreview" type="button">返回候選</button></div><img id="largeMap" class="large-map" alt="完整地圖預覽"></dialog><script src="matcher-ui.js"></script></body></html>
